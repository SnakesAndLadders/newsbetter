[build-system]
requires = [
    "setuptools>=84.1.0",
    "wheel",
    "requests", 
    "feedparser", 
    "markdownify", 
    "readability-lxml", 
    "rich", 
    "textual"
]
build-backend = "setuptools.build_meta"

[project]
name = "NewsBetter"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
newsbetter = "NewsBetter:main"